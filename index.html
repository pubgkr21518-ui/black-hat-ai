<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA — Uncensored AI</title>
<meta name="description" content="Uncensored AI agent. No signup. Never says I cannot help with that.">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 L29 9.5 L16 30 L3 9.5 Z' fill='%23e5c98a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0c;--side:#0d0d10;--panel:#141418;--panel2:#1b1b21;--panel3:#232329;
  --border:#242430;--border2:#33333f;--text:#f2f2f5;--muted:#8c8c9a;--muted2:#5f5f6d;
  --accent:#5b8cff;--gold:#e5c98a;--gold2:#b8944e;
}
[data-theme="light"]{
  --bg:#fafafa;--side:#f3f3f5;--panel:#fff;--panel2:#f0f0f3;--panel3:#e8e8ec;
  --border:#e4e4ea;--border2:#d2d2da;--text:#111114;--muted:#6a6a78;--muted2:#9a9aa6;
}
html,body{height:100%}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px}
#app{display:grid;grid-template-columns:262px 1fr;height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.14s;flex:0 0 34px}
.ico:hover{background:var(--panel2);color:var(--text)}
.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}

#side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.side-top{padding:13px 11px 7px;display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:center;gap:9px;padding:3px 5px}
.brand svg{width:24px;height:24px;flex:0 0 24px}
.brand b{font-size:15.5px;font-weight:600;letter-spacing:.7px}
.brand small{font-size:9px;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;margin-left:auto}
.newbtn{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font-size:13.5px;font-weight:500;transition:.15s;width:100%}
.newbtn:hover{background:var(--panel2);border-color:var(--border2)}
.newbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.srch{background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px;outline:0;width:100%}
.srch:hover{background:var(--panel)}
.srch:focus{background:var(--panel);border-color:var(--border2)}
.srch::placeholder{color:var(--muted2)}
.side-label{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;padding:8px 16px 4px}
#list{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:1px}
.ci{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;font-size:13.4px;color:var(--muted);cursor:pointer;transition:.13s}
.ci:hover{background:var(--panel);color:var(--text)}
.ci.on{background:var(--panel2);color:var(--text)}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .x{opacity:0;font-size:15px;color:var(--muted2);padding:0 2px;line-height:1}
.ci:hover .x{opacity:1}
.side-bot{border-top:1px solid var(--border);padding:10px 11px;display:flex;flex-direction:column;gap:8px}
.unc-chip{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;background:linear-gradient(90deg,rgba(229,201,138,.10),transparent);border:1px solid rgba(229,201,138,.25);font-size:11.5px;color:var(--gold)}
.unc-chip .d{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold);flex:0 0 6px}
.bot-row{display:flex;gap:4px}
.bot-row .ico{flex:1;width:auto}

#main{display:flex;flex-direction:column;overflow:hidden;position:relative}
#main::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(720px 400px at 50% -10%,rgba(91,140,255,.10),transparent 72%)}
.top{display:flex;align-items:center;gap:7px;padding:11px 16px;position:relative;z-index:3}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 11px;color:var(--muted);transition:.15s;max-width:220px}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;opacity:.75;flex:0 0 13px}
.pill select{background:none;border:0;color:inherit;font-size:12.6px;outline:0;cursor:pointer;max-width:172px;appearance:none;font-weight:500;text-overflow:ellipsis}
.pill select option{background:#15151b;color:#eee}
[data-theme="light"] .pill select option{background:#fff;color:#111}
.spacer{flex:1}
.chipbtn{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:6px 11px;border-radius:20px;border:1px solid var(--border);color:var(--muted2);transition:.15s;white-space:nowrap}
.chipbtn.on{border-color:rgba(229,201,138,.42);color:var(--gold);background:rgba(229,201,138,.07)}
.chipbtn:hover{border-color:var(--border2)}

#msgs{flex:1;overflow-y:auto;padding:8px 16px 20px;position:relative;z-index:1}
.wrap{max-width:770px;margin:0 auto}

.hello{max-width:770px;margin:0 auto;padding-top:13vh;text-align:center;animation:up .5s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.hello .g{font-size:39px;font-weight:300;letter-spacing:-1.3px;margin-bottom:13px;line-height:1.18}
.hello .g em{font-style:normal;background:linear-gradient(100deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hello .s{color:var(--muted);font-size:14.2px;margin-bottom:28px;font-weight:300;line-height:1.6}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:590px;margin:0 auto}
.card{text-align:left;padding:12px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--border);transition:.16s}
.card:hover{background:var(--panel2);border-color:var(--border2);transform:translateY(-2px)}
.card b{display:block;font-size:12.8px;font-weight:500;margin-bottom:3px}
.card small{font-size:11.4px;color:var(--muted2);line-height:1.45;display:block}

.msg{display:flex;gap:11px;margin-bottom:25px;animation:up .22s ease}
.msg.me{justify-content:flex-end}
.av{width:27px;height:27px;flex:0 0 27px;border-radius:50%;display:grid;place-items:center;margin-top:2px}
.av svg{width:15px;height:15px}
.bd{min-width:0;max-width:100%}
.msg.me .bd{max-width:84%;display:flex;flex-direction:column;align-items:flex-end}
.mname{font-size:10.4px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px;width:100%}
.msg.me .mname{justify-content:flex-end}
.acts{margin-left:auto;display:flex;gap:4px;opacity:0;transition:.15s}
.msg:hover .acts{opacity:1}
.msg.me .acts{margin-left:0}
.mini{font-size:10.4px;padding:3px 9px;border-radius:7px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
.mini:hover{color:var(--text);border-color:var(--border2)}
.msg.me .content{background:var(--panel2);border:1px solid var(--border);border-radius:16px 16px 4px 16px;padding:11px 15px;display:inline-block}
.content{font-size:15px;line-height:1.75;word-wrap:break-word;overflow-wrap:anywhere;text-align:left}
.content p{margin-bottom:12px}.content p:last-child{margin-bottom:0}
.content h1,.content h2,.content h3{margin:18px 0 9px;line-height:1.3;font-weight:600}
.content h1{font-size:21px}.content h2{font-size:18px}.content h3{font-size:16px}
.content ul,.content ol{margin:0 0 12px 22px}.content li{margin-bottom:5px}
.content a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(91,140,255,.35)}
.content blockquote{border-left:2px solid var(--gold2);padding-left:13px;color:var(--muted);margin:12px 0;font-style:italic}
.content table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--border);padding:8px 11px;text-align:left}
.content th{background:var(--panel2);font-weight:600}
.content hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.content img{max-width:100%;border-radius:12px;margin:8px 0;cursor:zoom-in}
.content code{font-family:'JetBrains Mono',monospace;font-size:12.8px;background:var(--panel2);padding:2px 6px;border-radius:5px}
.cb{margin:13px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0b0b10}
.cbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);font-size:10.4px;color:var(--muted2);font-family:'JetBrains Mono',monospace;letter-spacing:.6px;text-transform:uppercase}
.cpy{font-size:10.4px;padding:3px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.cpy:hover{color:var(--text)}
.cb pre{margin:0;padding:14px;overflow-x:auto}
.cb pre code{background:none;padding:0;font-size:12.6px;line-height:1.65}
.stream::after{content:"\25CB";color:var(--gold);animation:bl .8s infinite;margin-left:3px}
@keyframes bl{50%{opacity:.2}}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.msg.me .thumbs{justify-content:flex-end}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:11px;border:1px solid var(--border)}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.32);color:#fca5a5;padding:11px 14px;border-radius:11px;font-size:13.5px}
.forced{font-size:9.5px;color:var(--gold);background:rgba(229,201,138,.09);border:1px solid rgba(229,201,138,.25);padding:2px 8px;border-radius:20px;letter-spacing:.5px}

#comp{padding:0 16px 18px;position:relative;z-index:2}
.cwrap{max-width:770px;margin:0 auto}
.arow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.arow .a{position:relative}
.arow img{width:54px;height:54px;object-fit:cover;border-radius:11px;border:1px solid var(--border)}
.arow .rm{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:#ef4444;color:#fff;font-size:12px;display:grid;place-items:center;line-height:1}
.box{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:7px 8px 7px 15px;display:flex;align-items:flex-end;gap:6px;transition:.18s;box-shadow:0 6px 26px rgba(0,0,0,.35)}
.box:focus-within{border-color:var(--border2);box-shadow:0 6px 32px rgba(91,140,255,.13)}
#inp{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px;line-height:1.55;resize:none;max-height:180px;padding:9px 0;font-family:inherit}
#inp::placeholder{color:var(--muted2)}
.actsr{display:flex;align-items:center;gap:4px}
.snd{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0a0c;display:grid;place-items:center;transition:.15s;flex:0 0 36px}
.snd:hover{filter:brightness(1.12);transform:scale(1.05)}
.snd svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sub{display:flex;align-items:center;gap:11px;justify-content:center;margin-top:9px;font-size:10.8px;color:var(--muted2);flex-wrap:wrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:2px}
.seg button{padding:4px 11px;border-radius:18px;font-size:10.8px;color:var(--muted2)}
.seg button.on{background:var(--panel3);color:var(--text)}
.mdl{background:transparent;border:0;color:var(--muted2);font-size:10.8px;outline:0;cursor:pointer;max-width:140px}
.mdl option{background:#15151b;color:#eee}

dialog{background:var(--side);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:0;width:min(600px,93vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.dh b{font-size:15px;font-weight:600}
.db{padding:18px 20px;overflow-y:auto;max-height:62vh;display:flex;flex-direction:column;gap:16px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.f input,.f textarea,.f select{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13.4px;outline:0}
.f textarea{resize:vertical;min-height:130px;line-height:1.6;font-size:12.6px;font-family:'JetBrains Mono',monospace}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent)}
.f .h{font-size:11px;color:var(--muted2);margin-top:5px;line-height:1.5}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pres{display:flex;flex-wrap:wrap;gap:6px}
.pres button{font-size:11.4px;padding:5px 11px;border-radius:20px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
.pres button:hover{color:var(--text);border-color:var(--border2)}
.df{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:9px}
.btn{padding:9px 15px;border-radius:9px;background:var(--panel);border:1px solid var(--border);font-size:13.2px;font-weight:500;transition:.15s}
.btn:hover{background:var(--panel2);border-color:var(--border2)}
.btn.g{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;color:#0a0a0c;font-weight:600}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{width:42px;height:23px;border-radius:20px;background:var(--panel3);border:1px solid var(--border);position:relative;transition:.18s;flex:0 0 42px;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:.18s}
.sw.on{background:rgba(229,201,138,.22);border-color:rgba(229,201,138,.5)}
.sw.on::after{left:21px;background:var(--gold)}
#err{display:none;position:fixed;left:0;right:0;bottom:0;background:#7f1d1d;color:#fff;font-size:11px;padding:7px 11px;z-index:9999;line-height:1.4}
.mob{display:none}
@media(max-width:880px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:268px;z-index:60;transform:translateX(-103%);transition:.25s;box-shadow:0 0 70px rgba(0,0,0,.75)}
  #side.open{transform:none}
  .mob{display:grid}
  .hello{padding-top:8vh}.hello .g{font-size:29px}
  .cards{grid-template-columns:1fr;gap:7px}
  .msg.me .bd{max-width:90%}
  #msgs{padding:6px 12px 16px}#comp{padding:0 12px 14px}
  .r2{grid-template-columns:1fr}
  .top{padding:10px 12px;gap:6px}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<div id="app">
  <aside id="side">
    <div class="side-top">
      <div class="brand">
        <svg viewBox="0 0 32 32"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2dda8"/><stop offset="1" stop-color="#b8944e"/></linearGradient></defs><path d="M16 2 L29 9.5 L16 30 L3 9.5 Z" fill="url(#g1)"/><path d="M16 8.5 L22.5 12 L16 22 L9.5 12 Z" fill="#0a0a0c" opacity=".5"/></svg>
        <b>NOVA</b><small>uncensored</small>
      </div>
      <button class="newbtn" id="newBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New chat</button>
      <input class="srch" id="srch" placeholder="Search chats">
    </div>
    <div class="side-label">Chats</div>
    <div id="list"></div>
    <div class="side-bot">
      <div class="unc-chip" id="uncChip"><span class="d"></span><span id="uncTxt">Uncensored mode: ON</span></div>
      <div class="bot-row">
        <button class="ico" id="setBtn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button class="ico" id="themeBtn" title="Theme"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <button class="ico" id="expBtn" title="Export"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
        <button class="ico" id="impBtn" title="Import"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></button>
      </div>
    </div>
  </aside>

  <main id="main">
    <div class="top">
      <button class="ico mob" id="menuBtn"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="pill">
        <svg viewBox="0 0 24 24"><path d="M12 2 L20 7 L12 22 L4 7 Z"/></svg>
        <select id="provSel"></select>
      </div>
      <div class="pill">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        <select id="modSel"></select>
      </div>
      <span class="spacer"></span>
      <button class="chipbtn on" id="uncBtn">Uncensored</button>
      <button class="ico" id="clrBtn" title="Clear"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>

    <div id="msgs"></div>

    <div id="comp">
      <div class="cwrap">
        <div class="arow" id="arow"></div>
        <div class="box">
          <textarea id="inp" rows="1" placeholder="Kuch bhi pucho..."></textarea>
          <div class="actsr">
            <button class="ico" id="attBtn" title="Attach"><svg viewBox="0 0 24 24"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.49-8.48"/></svg></button>
            <button class="ico hide" id="stpBtn" title="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
            <button class="snd" id="sndBtn"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </div>
        </div>
        <div class="sub">
          <div class="seg"><button class="on" data-m="chat">Chat</button><button data-m="image">Image</button></div>
          <select id="szSel" class="mdl hide"></select>
          <span id="tip">Ready</span>
        </div>
      </div>
    </div>
  </main>
</div>

<dialog id="dlg">
  <div class="dh"><b>Settings</b><button class="ico" id="dlgX"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="db">

function ferr(s,t){try{var j=JSON.parse(t);return j.error&&j.error.message||j.message||j.detail||String(t).slice(0,250)}catch(e){return 'HTTP '+s+' - '+String(t).slice(0,250)}}

function apiStream(o){
  var provider=o.provider,model=o.model,messages=o.messages,system=o.system,signal=o.signal,onDelta=o.onDelta;
  if(provider==='gemini')return apiGemini(o);
  var p=PROVIDERS[provider];
  if(!p)return Promise.reject(new Error('Unknown provider'));
  var base=(provider==='custom'?S.set.cbase:(p.base||'')).replace(/\/+$/,'');
  if(!base)return Promise.reject(new Error('Custom base URL daalo settings mein.'));
  var key=S.set.keys[provider]||'';
  if(!p.keyless&&!key)return Promise.reject(new Error(p.label+' ki API key settings mein daalo.'));
  var headers={'Content-Type':'application/json'};
  if(key)headers['Authorization']='Bearer '+key;
  if(provider==='openrouter'){headers['HTTP-Referer']=location.origin;headers['X-Title']='NOVA'}
  var msgs=[{role:'system',content:system}].concat(messages);
  var body={model:model,messages:msgs,stream:!!S.set.stream,temperature:S.set.temp,max_tokens:S.set.maxTokens};

  return fetch(base+'/chat/completions',{method:'POST',headers:headers,body:JSON.stringify(body),signal:signal})
  .then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(ferr(r.status,t))});
    var ctp=r.headers.get('content-type')||'';
    if(!r.body||ctp.indexOf('application/json')>=0){
      return r.json().then(function(j){
        var t=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
        onDelta(t);return t;
      });
    }
    var rd=r.body.getReader(),dc=new TextDecoder(),buf='',full='';
    function pump(){
      return rd.read().then(function(res){
        if(res.done)return full;
        buf+=dc.decode(res.value,{stream:true});
        var lines=buf.split('\n');buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var l=lines[i].trim();
          if(!l||l.charAt(0)===':')continue;
          var d=l.indexOf('data:')===0?l.slice(5).trim():l;
          if(d==='[DONE]')continue;
          try{
            var j=JSON.parse(d);
            var ch=j.choices&&j.choices[0];
            var t=(ch&&ch.delta&&ch.delta.content)||(ch&&ch.text)||(ch&&ch.message&&ch.message.content)||'';
            if(t){full+=t;onDelta(t)}
          }catch(e){}
        }
        return pump();
      });
    }
    return pump();
  });
}
function gparts(m){
  var p=[];
  if(m.atts&&m.atts.length)m.atts.forEach(function(a){
    var mm=a.match(/^data:(.+?);base64,(.*)$/);
    if(mm)p.push({inline_data:{mime_type:mm[1],data:mm[2]}});
  });
  if(m.content)p.push({text:m.content});
  if(!p.length)p.push({text:' '});
  return p;
}
function apiGemini(o){
  var model=o.model,messages=o.messages,system=o.system,signal=o.signal,onDelta=o.onDelta;
  var key=S.set.keys.gemini;
  if(!key)return Promise.reject(new Error('Gemini API key daalo.'));
  var url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':streamGenerateContent?alt=sse&key='+key;
  var contents=[];
  messages.forEach(function(m){
    var role=m.role==='assistant'?'model':'user';
    var parts=m.role==='assistant'?[{text:m.content||' '}]:gparts(m);
    if(contents.length&&contents[contents.length-1].role===role){
      contents[contents.length-1].parts=contents[contents.length-1].parts.concat(parts);
    } else contents.push({role:role,parts:parts});
  });
  var cats=['HARM_CATEGORY_HARASSMENT','HARM_CATEGORY_HATE_SPEECH','HARM_CATEGORY_SEXUALLY_EXPLICIT','HARM_CATEGORY_DANGEROUS_CONTENT','HARM_CATEGORY_CIVIC_INTEGRITY'];
  var ss=cats.map(function(c){return {category:c,threshold:'BLOCK_NONE'}});
  var body={contents:contents,systemInstruction:{parts:[{text:system}]},
    generationConfig:{temperature:S.set.temp,maxOutputTokens:S.set.maxTokens},safetySettings:ss};
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:signal})
  .then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(ferr(r.status,t))});
    var rd=r.body.getReader(),dc=new TextDecoder(),buf='',full='';
    function pump(){
      return rd.read().then(function(res){
        if(res.done)return full;
        buf+=dc.decode(res.value,{stream:true});
        var lines=buf.split('\n');buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var l=lines[i].trim();
          if(l.indexOf('data:')!==0)continue;
          var d=l.slice(5).trim();
          if(!d||d==='[DONE]')continue;
          try{
            var j=JSON.parse(d);
            var ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
            var t=ps.map(function(x){return x.text||''}).join('');
            if(t){full+=t;onDelta(t)}
          }catch(e){}
        }
        return pump();
      });
    }
    return pump();
  });
}

function send(){

  if(c.msgs.filter(function(m){return m.role==='user'}).length===1)c.title=(t||'Image').slice(0,40);
  $('inp').value='';grow();atts=[];drawAtt();save();renderList();renderMsgs();

}

  var acc='';
  return apiStream({provider:S.set.provider,model:S.set.model,
    messages:bmsgs(c).slice(0,-1),system:buildSystem(!!o.force),signal:ctrl.signal,
    onDelta:function(t){
      acc+=t;box.content=acc;el=node();
      if(el){
        el.classList.remove('stream');
        var d=document.createElement('div');d.className='md';d.innerHTML=md(acc);
        el.replaceWith(d);d.classList.add('stream');el=d;
      }
      down();
    }
  }).then(function(){
    box.content=acc||'_(khaali jawab)_';
    save();renderMsgs();
    if(!o.noFix&&S.set.autofix&&S.set.uncensored&&isRefusal(acc)){
      st('refusal pakda gaya - dobara force kar raha hoon...');
      return new Promise(function(r){setTimeout(r,150)}).then(function(){return run(c,{box:box,force:true,noFix:true})});
    }
    st('ready');
  }).catch(function(e){
    if(e&&e.name==='AbortError'){box.content=acc||'_(roka gaya)_';st('stopped')}
    else{box.content='**Error:** '+(e&&e.message?e.message:String(e));box.err=true;st('error')}
    save();renderMsgs();
  }).then(function(){
    ctrl=null;$('sndBtn').classList.remove('hide');$('stpBtn').classList.add('hide');
  });
}
function genImg(c,p){
  var wh=(S.set.imgSize||'1024x1024').split('x');
  var u='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width='+wh[0]+'&height='+wh[1]+'&seed='+Math.floor(Math.random()*1e6)+'&model=flux&nologo=true';
  var b=push(c,{role:'assistant',content:'**'+p+'**',imgs:[u]});
  save();renderMsgs();st('image ban rahi hai...');
  var i=new Image();
  i.onload=function(){st('ready')};
  i.onerror=function(){b.content='Image nahi bani, dobara try karo.';b.err=true;save();renderMsgs();st('error')};
  i.src=u;
}
function drawAtt(){
  var a=$('arow');a.innerHTML='';
  atts.forEach(function(x,idx){
    var d=document.createElement('div');d.className='a';
    d.innerHTML='<img src="'+x+'"><button class="rm">\u00D7</button>';
    d.querySelector('.rm').onclick=function(){atts.splice(idx,1);drawAtt()};
    a.appendChild(d);
  });
}

$('sndBtn').onclick=send;
$('stpBtn').onclick=function(){if(ctrl)ctrl.abort()};
$('inp').addEventListener('input',grow);
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>880){e.preventDefault();send()}});
$('newBtn').onclick=function(){S.active=null;chat();save();renderList();renderMsgs();$('inp').focus()};
$('clrBtn').onclick=function(){var c=chat();c.msgs=[];save();renderMsgs()};
$('srch').oninput=function(){q=this.value;renderList()};
$('menuBtn').onclick=function(){$('side').classList.add('open')};
$('attBtn').onclick=function(){$('fInp').click()};
$('fInp').onchange=function(){
  var fs=this.files;
  for(var i=0;i<fs.length;i++){
    (function(f){
      var r=new FileReader();
      r.onload=function(){atts.push(r.result);drawAtt()};
      r.readAsDataURL(f);
    })(fs[i]);
  }
  this.value='';
};
var segs=document.querySelectorAll('.seg button');
for(var si=0;si<segs.length;si++){
  segs[si].onclick=function(){
    for(var k=0;k<segs.length;k++)segs[k].classList.remove('on');
    this.classList.add('on');
    S.mode=this.getAttribute('data-m');save();
    $('szSel').classList.toggle('hide',S.mode!=='image');
    $('inp').placeholder=S.mode==='image'?'Image describe karo...':'Kuch bhi pucho...';
  };
}
SIZES.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;$('szSel').appendChild(o)});
$('szSel').value=S.set.imgSize;
$('szSel').onchange=function(){S.set.imgSize=this.value;save()};
$('provSel').onchange=function(){S.set.provider=this.value;S.set.model=(PROVIDERS[this.value].models[0]||'');save();fillMod()};
$('modSel').onchange=function(){S.set.model=this.value;save()};
$('uncBtn').onclick=function(){S.set.uncensored=!S.set.uncensored;save();syncUnc()};
function syncUnc(){
  $('uncBtn').classList.toggle('on',S.set.uncensored);
  $('uncBtn').textContent=S.set.uncensored?'Uncensored':'Safe-ish';
  $('uncTxt').textContent='Uncensored mode: '+(S.set.uncensored?'ON':'OFF');
  $('uncChip').style.opacity=S.set.uncensored?1:.45;
}
$('themeBtn').onclick=function(){S.set.theme=S.set.theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',S.set.theme);save()};
$('expBtn').onclick=function(){
  var b=new Blob([JSON.stringify(S.chats,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nova-chats.json';a.click();
};
$('impBtn').onclick=function(){$('impFile').click()};
$('impFile').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var j=JSON.parse(r.result);if(Object.prototype.toString.call(j)==='[object Array]'){S.chats=j.concat(S.chats);save();renderList();st('imported')}}catch(x){alert('Bad file')}
  };
  r.readAsText(f);
};
$('setBtn').onclick=function(){
  $('setProv').value=S.set.provider;$('cbase').value=S.set.cbase;
  $('tmp').value=S.set.temp;$('tv').textContent=S.set.temp;$('mtk').value=S.set.maxTokens;$('sys').value=S.set.system;
  $('swUnc').classList.toggle('on',S.set.uncensored);
  $('swFix').classList.toggle('on',S.set.autofix);
  $('swStr').classList.toggle('on',S.set.stream);
  drawKeys();$('dlg').showModal();
};
$('dlgX').onclick=function(){$('dlg').close()};
function drawKeys(){
  var c=$('keys');c.innerHTML='';
  Object.keys(PROVIDERS).forEach(function(k){
    var v=PROVIDERS[k];
    if(!v.keyName)return;
    var d=document.createElement('div');d.className='f';
    d.innerHTML='<label>'+esc(v.label)+' - API key</label><input data-k="'+k+'" type="password" placeholder="paste key" value="'+esc(S.set.keys[k]||'')+'">';
    c.appendChild(d);
  });
}
$('tmp').oninput=function(){$('tv').textContent=this.value};
['swUnc','swFix','swStr'].forEach(function(id){$(id).onclick=function(){this.classList.toggle('on')}});
$('saveBtn').onclick=function(){
  S.set.provider=$('setProv').value;
  S.set.cbase=$('cbase').value.trim();
  S.set.temp=parseFloat($('tmp').value);
  S.set.maxTokens=parseInt($('mtk').value,10)||8192;
  S.set.system=$('sys').value;
  S.set.uncensored=$('swUnc').classList.contains('on');
  S.set.autofix=$('swFix').classList.contains('on');
  S.set.stream=$('swStr').classList.contains('on');
  var ins=document.querySelectorAll('#keys input');
  for(var i=0;i<ins.length;i++)S.set.keys[ins[i].getAttribute('data-k')]=ins[i].value.trim();
  save();fillProv();$('provSel').value=S.set.provider;fillMod();syncUnc();
  $('dlg').close();st('saved');
};
$('resetBtn').onclick=function(){if(confirm('Sab kuch delete?')){localStorage.removeItem(LS);location.reload()}};
$('rfBtn').onclick=function(){
  fetch('https://text.pollinations.ai/models').then(function(r){return r.json()}).then(function(j){
    var n=(Array.isArray(j)?j:[]).map(function(x){return typeof x==='string'?x:(x.name||x.id)}).filter(Boolean);
    if(n.length){PROVIDERS.pollinations.models=n;fillMod();st('models refreshed')}
  }).catch(function(){st('refresh failed')});
};
Object.keys(PRESETS).forEach(function(n){
  var b=document.createElement('button');b.textContent=n;
  b.onclick=function(){$('sys').value=PRESETS[n]};
  $('pres').appendChild(b);
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('newBtn').click()}
});

document.documentElement.setAttribute('data-theme',S.set.theme);
fillProv();
drawKeys();
renderList();
renderMsgs();
grow();
syncUnc();
st('Ready');
</script>
</body>
</html>
